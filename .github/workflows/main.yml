name: Flutter iOS Build

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Vérifier Flutter
        run: flutter doctor -v

      - name: Installer les dépendances Flutter
        run: flutter pub get

      - name: Installer CocoaPods
        run: pod install
        working-directory: mobile/ios

      - name: Compiler iOS
        run: flutter build ios --release --no-codesign

      - name: Sauvegarder l'application
        uses: actions/upload-artifact@v4
        with:
          name: flutter-ios-build
          path: mobile/build/ios/iphoneos/Runner.app
