# Variante HTTPS de nginx.conf (voir infra/README-HEBERGEMENT.md, mode 2).
# Attend les certificats montés dans /etc/nginx/certs :
#   fullchain.pem  (certificat + chaîne intermédiaire)
#   privkey.pem    (clé privée)
resolver 127.0.0.11 valid=30s;

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # Aligné sur spring.servlet.multipart.max-request-size (20 Mo).
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /files/ {
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
