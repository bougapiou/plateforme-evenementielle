resolver 127.0.0.11 valid=30s;

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # A variable forces nginx to resolve "backend" per-request via Docker's
        # embedded DNS (above) instead of once at config-load time — otherwise
        # nginx refuses to start at all if "backend" isn't resolvable yet
        # (e.g. compose startup ordering), and won't recover if it's briefly
        # unavailable later. No path after the variable: with a variable,
        # nginx only forwards what's written here verbatim — omitting it is
        # what makes it pass the original request URI through unchanged.
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /files/ {
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
