resolver 127.0.0.11 valid=30s;

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Aligné sur spring.servlet.multipart.max-request-size (20 Mo) ; sans ça
    # nginx refuse tout envoi > 1 Mo (413).
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Durcissement navigateur (complète la protection des jetons, SEC-03).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;

    location /api/ {
        # A variable forces nginx to resolve "backend" per-request via Docker's
        # embedded DNS (above) instead of once at config-load time — otherwise
        # nginx refuses to start at all if "backend" isn't resolvable yet
        # (e.g. compose startup ordering), and won't recover if it's briefly
        # unavailable later. No path after the variable: with a variable,
        # nginx only forwards what's written here verbatim — omitting it is
        # what makes it pass the original request URI through unchanged.
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /files/ {
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream;
    }

    # Aperçu des liens partagés (WhatsApp, Facebook…) : page HTML avec les
    # balises Open Graph de l'événement, générée par l'API (PART-08).
    location /partage/ {
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Le service worker et le manifeste doivent toujours être revalidés.
    # (« expires » plutôt que add_header : un add_header dans un location
    # masquerait les en-têtes de sécurité déclarés au niveau du server.)
    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        expires -1;
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Fichiers Angular empreintés (main-XXXX.js…) : cache long (PART-11, 3G).
    location ~* "-[A-Z0-9]{8,}\.(js|css)$" {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
