# Production hosting: backend + frontend, on the App VM. The database stays
# native on its own VM (see docs/DEPLOIEMENT — DB_URL points to it), it is
# not containerized here.
#
# Usage: from infra/, `docker compose -f docker-compose.prod.yml up -d --build`
# Needs a `.env.prod` file next to this one (see backend/.env.prod.example).
services:
  backend:
    build:
      context: ../backend
    container_name: plateforme-backend
    restart: unless-stopped
    env_file:
      - .env.prod
    expose:
      - "8080"
    volumes:
      - backend_storage:/app/storage

  frontend:
    build:
      context: ../frontend
    container_name: plateforme-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend_storage:
