services:
  postgres:
    image: postgres:16-alpine
    container_name: plateforme-postgres
    environment:
      POSTGRES_DB: plateforme
      POSTGRES_USER: plateforme
      POSTGRES_PASSWORD: plateforme
    ports:
      # Host port 5433 to avoid clashing with a locally installed PostgreSQL.
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plateforme -d plateforme"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: plateforme-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    environment:
      MP_MAX_MESSAGES: 500

  minio:
    image: minio/minio:latest
    container_name: plateforme-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: plateforme
      MINIO_ROOT_PASSWORD: plateforme-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  miniodata:
