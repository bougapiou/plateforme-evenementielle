spring:
  application:
    name: plateforme-evenementielle
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/plateforme}
    username: ${DB_USERNAME:plateforme}
    password: ${DB_PASSWORD:plateforme}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  # Public base URL of the web front-end — used to build links in e-mails
  # (password reset, …). Pin FRONTEND_BASE_URL to the real domain in production.
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  cors:
    # Origin patterns (comma-separated). Dev default covers any localhost port
    # (Angular `ng serve`, `flutter run -d chrome`). Pin CORS_ORIGINS to the real
    # domain(s) in production, e.g. https://plateforme.bf
    allowed-origins: ${CORS_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}
  security:
    rate-limit-per-minute: ${RATE_LIMIT_PER_MINUTE:20}
    jwt:
      # Base64-encoded 256-bit secret. Override in production via APP_JWT_SECRET.
      secret: ${APP_JWT_SECRET:Y2hhbmdlLW1lLXRoaXMtaXMtYS1kZXYtb25seS1zZWNyZXQtMzJieXRlcyE=}
      access-token-ttl: PT15M
      refresh-token-ttl: P7D
      issuer: plateforme-evenementielle
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local:
      base-path: ${STORAGE_LOCAL_PATH:./data/storage}
      base-url: ${STORAGE_LOCAL_URL:http://localhost:8080/files}
  payment:
    provider: ${PAYMENT_PROVIDER:sandbox}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:dev-webhook-secret}
  bootstrap:
    demo-data: ${DEMO_DATA:false}
    super-admin:
      email: ${SUPER_ADMIN_EMAIL:admin@plateforme.bf}
      password: ${SUPER_ADMIN_PASSWORD:ChangeMe!2026}
      first-name: Super
      last-name: Admin

# Passerelle de paiement FasoArzeka (AvePLUS) — utilisée seulement quand
# app.payment.provider=arzeka ; le provider "sandbox" ne lit jamais ce bloc.
# Les identifiants réels vont dans un .env local (jamais commité) — voir
# .env.example. Test : https://pgw-test.fasoarzeka.bf
arzeka:
  base-url: ${FASOARZEKA_BASE_URL:https://pgw-test.fasoarzeka.bf}
  initiate-payment-uri: ${FASOARZEKA_INITIATE_PAYMENT_URI:/AvepayPaymentGatewayUI/avepay-payment/app/validorder}
  check-order-status-uri: ${FASOARZEKA_CHECK_ORDER_STATUS_URI:/AvepayPaymentGatewayUI/avepay-payment/app/getThirdPartyMapInfo}
  auth-uri: ${FASOARZEKA_AUTH_URI:/AvepayPaymentGatewayUI/avepay-payment/auth/getToken}
  merchant-id: ${FASOARZEKA_MERCHANT_ID:}
  username: ${FASOARZEKA_USERNAME:}
  password: ${FASOARZEKA_PASSWORD:}
  grant-type: ${FASOARZEKA_GRANT_TYPE:access_token}
  callback-base-url: ${APP_CALLBACK_BASE_URL:http://localhost:8080}
  test-static-token: ${FASOARZEKA_TEST_STATIC_TOKEN:}

logging:
  level:
    org.flywaydb: info
