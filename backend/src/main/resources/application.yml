spring:
  application:
    name: plateforme-evenementielle
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/plateforme}
    username: ${DB_USERNAME:plateforme}
    password: ${DB_PASSWORD:plateforme}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  security:
    jwt:
      # Base64-encoded 256-bit secret. Override in production via APP_JWT_SECRET.
      secret: ${APP_JWT_SECRET:Y2hhbmdlLW1lLXRoaXMtaXMtYS1kZXYtb25seS1zZWNyZXQtMzJieXRlcyE=}
      access-token-ttl: PT15M
      refresh-token-ttl: P7D
      issuer: plateforme-evenementielle
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local:
      base-path: ${STORAGE_LOCAL_PATH:./data/storage}
      base-url: ${STORAGE_LOCAL_URL:http://localhost:8080/files}
  payment:
    provider: ${PAYMENT_PROVIDER:sandbox}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:dev-webhook-secret}
  bootstrap:
    super-admin:
      email: ${SUPER_ADMIN_EMAIL:admin@plateforme.bf}
      password: ${SUPER_ADMIN_PASSWORD:ChangeMe!2026}
      first-name: Super
      last-name: Admin

logging:
  level:
    org.flywaydb: info
